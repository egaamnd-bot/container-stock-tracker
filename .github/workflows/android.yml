name: Build Android APK

# The APK is a thin shell that loads the live GitHub Pages app, so it only needs
# rebuilding when the native shell changes (icon, name, Capacitor version) — not for app updates.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'

permissions:
  contents: write # publish the APK as a GitHub Release asset

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ] || [ -z "$AL" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS repo secrets. See docs/ANDROID_APK.md"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - name: Sync Capacitor config into the Android project
        run: mkdir -p dist && npx cap sync android

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          export APK_VERSION_NAME="$(node -p "require('./package.json').version").${{ github.run_number }}"
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/container-stock-tracker.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Verify signature
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs container-stock-tracker.apk | head -3

      - name: Publish to the "android" release (stable download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android app" --notes "Latest Android APK. Download: container-stock-tracker.apk" --latest
          gh release upload android container-stock-tracker.apk --clobber
          gh release edit android --notes "Latest Android APK — build ${{ github.run_number }} ($(date -u +%F)). Install: download container-stock-tracker.apk on your phone → open → allow 'Install unknown apps' for your browser."

      - uses: actions/upload-artifact@v4
        with:
          name: container-stock-tracker-apk
          path: container-stock-tracker.apk
